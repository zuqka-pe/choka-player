<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Metodo TVHTML5</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
    video { width: 100%; max-width: 500px; border-radius: 8px; background: #000; margin-bottom: 15px; }
    input, button { padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
    button { background: #28a745; color: white; cursor: pointer; margin-left: 5px; }
    #log { margin-top: 15px; font-size: 13px; color: #aaa; word-break: break-all; }
  </style>
</head>
<body>

  <h2>Prueba Método TVHTML5 (InnerTube)</h2>
  
  <video id="myVideo" controls playsinline></video>
  <br>
  <input type="text" id="videoId" placeholder="ID de YouTube" value="36cgoyKzdg0">
  <button id="btnObtener" onclick="extraerConTVHTML5()">Probar Extracción</button>

  <div id="log">Esperando prueba...</div>

  <script>
    async function extraerConTVHTML5() {
      const id = document.getElementById('videoId').value.trim();
      const log = document.getElementById('log');
      const video = document.getElementById('myVideo');
      const btn = document.getElementById('btnObtener');

      if (!id) return alert("Ingresa un ID válido");

      log.innerText = "Consultando API de YouTube con cliente TVHTML5...";
      btn.disabled = true;

      // Mismo payload que tu PHP
      const payload = {
        context: {
          client: {
            clientName: "TVHTML5",
            clientVersion: "7.20230405.08.01",
            hl: "es",
            gl: "US"
          }
        },
        videoId: id,
        contentCheckOk: true,
        racyCheckOk: true
      };

      try {
        const response = await fetch("https://www.youtube.com/youtubei/v1/player?prettyPrint=false", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        const formats = data?.streamingData?.formats || [];
        const adaptiveFormats = data?.streamingData?.adaptiveFormats || [];

        let directUrl = null;

        // 1. Buscar en formatos combinados (Audio + Video)
        for (const fmt of formats) {
          if (fmt.url) {
            directUrl = fmt.url;
            break;
          }
        }

        // 2. Si no hay, buscar mp4 adaptativo
        if (!directUrl) {
          for (const fmt of adaptiveFormats) {
            if (fmt.url && fmt.mimeType && fmt.mimeType.includes("video/mp4")) {
              directUrl = fmt.url;
              break;
            }
          }
        }

        if (directUrl) {
          log.innerText = "¡Éxito! URL directa obtenida. Reproduciendo...";
          video.src = directUrl;
          video.play();
        } else {
          log.innerText = "Error: El video no entregó 'url' limpia. Requiere algoritmo de Firma / Cipher (como la mayoría de videos en VOD).";
        }

      } catch (err) {
        console.error(err);
        log.innerText = "Error de red o bloqueo de CORS al conectar directo a YouTube desde el navegador.";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
