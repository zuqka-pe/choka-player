<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deez Audio Player</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Deez Player">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon-180.png">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="immersiveBg"></div>

    <div class="audio-player">
        <div class="audio-title">🔈 DeeZ Audio 🔈</div>

        <form id="searchForm">
            <input type="text" id="searchBox" placeholder="Search YouTube...">
            <br>
            <button type="submit">🔍 Search</button>
            <button type="button" id="btnScreenOff">🌑 Screen Off</button>
            <button type="button" id="btnImmersive">🌌 Immersive Mode</button>
        </form>

        <div id="searchResults" class="search-results"></div>

        <hr class="player-divider">

        <form id="audioForm">
            <input type="text" id="video_id" name="video_id" placeholder="Or enter YouTube Video ID">
            <br>
            <button type="submit">▶ Play</button>
            <button type="button" id="pauseResumeBtn">⏸ Pause</button>

            <div id="navControls" style="display:none;">
                <button type="button" id="btnPrevTrack">⏪ Last Song</button>
                <button type="button" id="btnNextTrack">Next Song ⏩</button>
            </div>
        </form>

        <div class="track-info" id="trackInfo">
            <img src="" alt="Video artwork" class="track-art" id="trackArt">
            <div class="track-title" id="trackTitle">Title: </div>
        </div>

        <div class="scrubber-wrap">
            <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1">
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div id="recommendedContentWrap" class="recommended-wrap">
            <button type="button" class="accordion-btn" id="btnAccordion">
                Recommended Content ▾
            </button>

            <div id="recommendedAccordionBody" class="recommended-accordion-body">
                <div id="queueStatus" class="queue-status"></div>
                <div id="recommendedContent"></div>
            </div>
        </div>

        <div class="video-wrapper">
            <div id="player"></div>
        </div>
    </div>

    <div id="screenOffOverlay">
        <div>Tap to return</div>
    </div>

    <!-- Scripts -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/ui.js"></script>
    <script src="js/queue.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
